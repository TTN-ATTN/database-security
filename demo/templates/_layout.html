<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Database Security Demo{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

{% if user %}
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand">🔒 DB Security Demo</span>
  <div class="d-flex align-items-center gap-3">
    <a href="http://127.0.0.1:3000" target="_blank" class="text-light small">📊 Grafana</a>
    <a href="http://127.0.0.1:9090/alerts" target="_blank" class="text-light small">📡 Prometheus</a>
    <a href="http://127.0.0.1:9093" target="_blank" class="text-light small">🚨 Alertmanager</a>
    <span class="vr text-secondary"></span>
    <span class="badge bg-{{ {'customer': 'primary', 'support': 'warning', 'admin': 'danger'}[user.role] }} text-uppercase">{{ user.role }}</span>
    <span class="text-light small">{{ user.display_name }} <span class="text-muted">({{ user.subtitle }})</span></span>
    <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline-light">Logout</a>
  </div>
</nav>
{% endif %}

<main class="container-fluid py-4" style="max-width: 1500px;">
  {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
